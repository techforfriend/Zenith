<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenith Canvas</title>
<style>
  :root { color-scheme: dark; --bg: #0b0b0f; --card: #16161c; --card2: #1d1d25; --line: #2a2a34; --text: #f4f4f7; --muted: #9a9aab; --accent: #fa586a; --accent2: #ff8a5c; --ok: #4cc38a; --bad: #ff6b6b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: radial-gradient(900px 420px at 50% -120px, rgba(250,88,106,0.22), transparent 70%), var(--bg); min-height: 100vh; }
  main { max-width: 560px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(60px + env(safe-area-inset-bottom, 0px)); }
  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .logo { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; font-size: 22px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 8px 24px rgba(250,88,106,0.35); }
  h1 { font-size: 22px; line-height: 1.2; margin: 0; letter-spacing: -0.3px; }
  .sub { color: var(--muted); margin: 2px 0 0; font-size: 14px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
  #auth { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 14px; }
  button { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--card2); color: var(--text); padding: 10px 16px; border-radius: 10px; cursor: pointer; transition: transform 0.12s ease, opacity 0.12s ease, background 0.12s ease; }
  button:active { transform: scale(0.97); }
  .tabs button { border: 0; background: transparent; color: var(--muted); border-radius: 10px; }
  .tabs button.on { background: var(--card2); color: var(--text); box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset; }
  button.primary { width: 100%; padding: 13px 16px; border: 0; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 8px 22px rgba(250,88,106,0.28); }
  button.ghost { width: 100%; border-style: dashed; border-color: rgba(250,88,106,0.55); color: var(--accent); background: rgba(250,88,106,0.08); }
  button:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 6px 2px 14px; }
  label { display: block; margin: 0 0 12px; color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 0.2px; }
  input { display: block; width: 100%; margin-top: 6px; padding: 12px 14px; font: inherit; font-weight: 400; color: var(--text); background: var(--card2); border: 1px solid var(--line); border-radius: 12px; outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(250,88,106,0.18); }
  input[type="file"] { padding: 10px; border-style: dashed; }
  input[type="file"]::file-selector-button { font: inherit; font-weight: 600; margin-right: 12px; padding: 8px 14px; border: 0; border-radius: 8px; color: #fff; background: var(--accent); }
  ul { list-style: none; padding: 0; margin: 0 0 14px; font-size: 14px; display: grid; gap: 6px; }
  li { padding: 8px 12px; border-radius: 10px; background: var(--card2); }
  li.ok { color: var(--ok); }
  li.bad { color: var(--bad); }
  .note { color: var(--muted); font-size: 13.5px; }
  #status, #findStatus { min-height: 20px; margin: 10px 0 0; text-align: center; }
  .rules { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .rules span { font-size: 12px; color: var(--muted); padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px; margin-bottom: 14px; }
  .card video { width: 100%; aspect-ratio: 1 / 1; border-radius: 12px; background: #000; display: block; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding: 0 4px 2px; }
  .row button { padding: 8px 16px; }
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="logo">Z</div>
    <div>
      <h1>Zenith Canvas</h1>
      <p class="sub">Upload canvas lagu dan pilih yang terbaik.</p>
    </div>
  </header>

  <div id="auth" class="panel">
    <div id="loginBox">
      <script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-login="Kakenawu_bot" data-size="large" data-onauth="onTelegramAuth(user)"></script>
    </div>
    <span id="who" class="note" hidden></span>
    <button id="logout" hidden>Keluar</button>
  </div>

  <nav class="tabs">
    <button id="tabUpload" class="on">Upload</button>
    <button id="tabBrowse">Jelajah</button>
  </nav>

  <section id="upload" class="panel">
    <button id="paste" class="ghost">Tempel info lagu dari app</button>
    <p class="hint">Buka Song Info di app Zenith, tekan Salin, lalu tempel di sini.</p>
    <label>Judul lagu<input id="song" placeholder="Persis seperti di app"></label>
    <label>Artis<input id="artist"></label>
    <label>Album (kosongkan kalau ragu)<input id="album"></label>
    <label>Video canvas (MP4)<input id="file" type="file" accept="video/mp4"></label>
    <ul id="checks"></ul>
    <button id="send" class="primary" disabled>Kirim</button>
    <p id="status" class="note"></p>
    <div class="rules">
      <span>MP4 H.264</span><span>Tanpa audio</span><span>1280x1280</span><span>3 sampai 8 detik</span><span>Maks 3 MB</span>
    </div>
    <p class="hint">Canvas tampil setelah disetujui admin.</p>
  </section>

  <section id="browse" class="panel" hidden>
    <button id="pasteFind" class="ghost">Tempel info lagu dari app</button>
    <p class="hint">Atau isi judul dan artis secara manual.</p>
    <label>Judul lagu<input id="qSong"></label>
    <label>Artis<input id="qArtist"></label>
    <button id="find" class="primary">Cari</button>
    <p id="findStatus" class="note"></p>
    <div id="results"></div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCO8txNS4UPwjrRKplPenuL-RA557gGhco",
  authDomain: "zenith-canvas-17133.firebaseapp.com",
  projectId: "zenith-canvas-17133",
  storageBucket: "zenith-canvas-17133.firebasestorage.app",
  messagingSenderId: "992141009224",
  appId: "1:992141009224:web:6f27b1b2e2dd9cdeb5937d"
};
const RULES = { width: 1280, height: 1280, minSec: 3, maxSec: 8, maxBytes: 3 * 1024 * 1024 };

const db = getFirestore(initializeApp(FIREBASE_CONFIG));
const $ = (id) => document.getElementById(id);

function session() {
  try { return JSON.parse(localStorage.getItem("zc_session") || "null"); } catch (e) { return null; }
}

function renderAuth() {
  const s = session();
  $("loginBox").hidden = !!s;
  $("who").hidden = !s;
  $("logout").hidden = !s;
  $("who").textContent = s ? "Masuk sebagai " + (s.name || "anggota") : "";
}

async function api(path, body) {
  const s = session();
  const headers = { "Content-Type": "application/json" };
  if (s) headers.Authorization = "Bearer " + s.token;
  const res = await fetch("/api/" + path, { method: "POST", headers, body: JSON.stringify(body) });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401) { localStorage.removeItem("zc_session"); renderAuth(); }
  if (!res.ok) {
    const err = new Error(data.error || data.message || "HTTP " + res.status);
    err.status = res.status;
    throw err;
  }
  return data;
}

window.onTelegramAuth = async (user) => {
  $("status").textContent = "Memeriksa login...";
  try {
    const res = await fetch("/api/auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(user)
    });
    const data = await res.json();
    if (!res.ok || !data.token) throw new Error(data.error || data.message || "HTTP " + res.status);
    localStorage.setItem("zc_session", JSON.stringify({ token: data.token, name: user.first_name || user.username || "" }));
    $("status").textContent = "";
    renderAuth();
  } catch (error) {
    $("status").textContent = "Login gagal: " + error.message;
  }
};

$("logout").onclick = () => {
  localStorage.removeItem("zc_session");
  renderAuth();
};

function liked() {
  try { return JSON.parse(localStorage.getItem("zc_liked") || "[]"); } catch (e) { return []; }
}

function norm(text) {
  return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}

function show(tab) {
  $("upload").hidden = tab !== "upload";
  $("browse").hidden = tab !== "browse";
  $("tabUpload").className = tab === "upload" ? "on" : "";
  $("tabBrowse").className = tab === "browse" ? "on" : "";
}
$("tabUpload").onclick = () => show("upload");
$("tabBrowse").onclick = () => show("browse");
renderAuth();

function parseSongInfo(text) {
  const out = { song: "", artist: "", album: "" };
  const map = { judul: "song", title: "song", song: "song", lagu: "song", artis: "artist", artist: "artist", album: "album" };
  for (const line of String(text || "").split(/\r?\n/)) {
    const m = line.match(/^\s*([A-Za-z]+)\s*[:=]\s*(.*)$/);
    if (!m) continue;
    const key = map[m[1].toLowerCase()];
    if (key) out[key] = m[2].trim();
  }
  return out;
}

async function readClipboardInfo() {
  let text = "";
  try {
    text = await navigator.clipboard.readText();
  } catch (e) {
    text = prompt("Tempel info lagu di sini:") || "";
  }
  return parseSongInfo(text);
}

$("paste").onclick = async () => {
  const info = await readClipboardInfo();
  if (!info.song && !info.artist) { $("status").textContent = "Format salinan tidak dikenali."; return; }
  $("song").value = info.song;
  $("artist").value = info.artist;
  $("album").value = info.album;
  $("status").textContent = "Info lagu terisi.";
};

$("pasteFind").onclick = async () => {
  const info = await readClipboardInfo();
  if (!info.song && !info.artist) { $("findStatus").textContent = "Format salinan tidak dikenali."; return; }
  $("qSong").value = info.song;
  $("qArtist").value = info.artist;
  $("findStatus").textContent = "Info lagu terisi.";
};

function inspect(file) {
  return new Promise((resolve) => {
    const video = document.createElement("video");
    const objectUrl = URL.createObjectURL(file);
    video.preload = "metadata";
    video.onloadedmetadata = () => {
      URL.revokeObjectURL(objectUrl);
      resolve({ width: video.videoWidth, height: video.videoHeight, duration: Math.round(video.duration * 10) / 10, size: file.size });
    };
    video.onerror = () => { URL.revokeObjectURL(objectUrl); resolve(null); };
    video.src = objectUrl;
  });
}

async function uploadVideo(file) {
  const ticket = await api("upload", { action: "ticket" });
  if (!ticket.uploadUrl || !ticket.name) throw new Error("izin upload tidak diberikan");
  const res = await fetch(ticket.uploadUrl, { method: "PUT", headers: { "Content-Type": "video/mp4" }, body: file });
  if (!res.ok) throw new Error("upload gagal (" + res.status + ")");
  return ticket.name;
}

let picked = null;

$("file").onchange = async () => {
  const file = $("file").files[0];
  const list = $("checks");
  list.innerHTML = "";
  picked = null;
  $("send").disabled = true;
  if (!file) return;
  const meta = await inspect(file);
  if (!meta) {
    const li = document.createElement("li");
    li.className = "bad";
    li.textContent = "Video tidak bisa dibaca";
    list.appendChild(li);
    return;
  }
  const checks = [
    ["Format MP4", file.type === "video/mp4"],
    ["Ukuran " + meta.width + "x" + meta.height + " (harus 1280x1280)", meta.width === RULES.width && meta.height === RULES.height],
    ["Durasi " + meta.duration + " detik (3 sampai 8)", meta.duration >= RULES.minSec && meta.duration <= RULES.maxSec],
    ["File " + (meta.size / 1048576).toFixed(2) + " MB (maksimal 3 MB)", meta.size <= RULES.maxBytes]
  ];
  let allOk = true;
  for (const [label, ok] of checks) {
    const li = document.createElement("li");
    li.className = ok ? "ok" : "bad";
    li.textContent = (ok ? "OK  " : "Gagal  ") + label;
    list.appendChild(li);
    if (!ok) allOk = false;
  }
  if (allOk) { picked = { file, meta }; $("send").disabled = false; }
};

$("send").onclick = async () => {
  const song = $("song").value.trim();
  const artist = $("artist").value.trim();
  const album = $("album").value.trim();
  if (!song || !artist) { $("status").textContent = "Isi judul lagu dan artis dulu."; return; }
  if (!picked) return;
  if (!session()) { $("status").textContent = "Login Telegram dulu."; return; }
  $("send").disabled = true;
  $("status").textContent = "Mengunggah...";
  try {
    const name = await uploadVideo(picked.file);
    await api("upload", {
      action: "submit",
      name,
      song, artist, album,
      duration: picked.meta.duration,
      width: picked.meta.width,
      height: picked.meta.height
    });
    $("status").textContent = "Terkirim. Menunggu persetujuan admin.";
    $("file").value = "";
    $("checks").innerHTML = "";
    picked = null;
  } catch (error) {
    const known = {
      limit_reached: "Batas upload harian tercapai (5 per hari).",
      not_member: "Akunmu bukan anggota grup Zenith.",
      login_required: "Login Telegram dulu.",
      spec_invalid: "Spesifikasi video tidak sesuai.",
      file_invalid: "File video tidak valid.",
      bad_text: "Judul, artis, atau album terlalu panjang."
    };
    $("status").textContent = "Gagal: " + (known[error.message] || error.message);
    $("send").disabled = false;
  }
};

function card(id, data) {
  const box = document.createElement("div");
  box.className = "card";
  const video = document.createElement("video");
  video.src = data.url;
  video.muted = true;
  video.loop = true;
  video.playsInline = true;
  video.controls = true;
  video.preload = "metadata";
  const row = document.createElement("div");
  row.className = "row";
  const count = document.createElement("span");
  count.textContent = (data.likes || 0) + " like";
  const button = document.createElement("button");
  const already = liked().includes(id);
  button.textContent = already ? "Sudah di-like" : "Like";
  button.disabled = already;
  button.onclick = async () => {
    if (!session()) { button.textContent = "Login dulu"; return; }
    button.disabled = true;
    try {
      await api("like", { id });
      data.likes = (data.likes || 0) + 1;
      count.textContent = data.likes + " like";
      localStorage.setItem("zc_liked", JSON.stringify([...liked(), id]));
      button.textContent = "Sudah di-like";
    } catch (error) {
      if (error.status === 409) {
        localStorage.setItem("zc_liked", JSON.stringify([...liked(), id]));
        button.textContent = "Sudah di-like";
      } else if (error.status === 401 || error.status === 403) {
        button.textContent = "Login dulu";
        button.disabled = false;
      } else {
        button.textContent = "Gagal, coba lagi";
        button.disabled = false;
      }
    }
  };
  row.append(count, button);
  box.append(video, row);
  return box;
}

$("find").onclick = async () => {
  const song = $("qSong").value.trim();
  const artist = $("qArtist").value.trim();
  const results = $("results");
  results.innerHTML = "";
  if (!song || !artist) { $("findStatus").textContent = "Isi judul lagu dan artis."; return; }
  $("findStatus").textContent = "Mencari...";
  try {
    const snap = await getDocs(query(
      collection(db, "canvases"),
      where("status", "==", "approved"),
      where("key", "==", norm(song) + "|" + norm(artist))
    ));
    const items = snap.docs.map((d) => ({ id: d.id, data: d.data() }));
    items.sort((a, b) => (b.data.likes || 0) - (a.data.likes || 0));
    $("findStatus").textContent = items.length ? items.length + " canvas ditemukan, yang teratas dipakai app." : "Belum ada canvas untuk lagu ini.";
    for (const item of items) results.appendChild(card(item.id, item.data));
  } catch (error) {
    $("findStatus").textContent = "Gagal memuat: " + error.message;
  }
};
</script>
</body>
</html>
