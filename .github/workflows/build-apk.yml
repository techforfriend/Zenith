name: "▒▒▒▒▒▒▒▒"
run-name: "▒▒▒▒"

on:
  push:
    branches: [main, master, dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[no build]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: build-apk
      cancel-in-progress: true
    env:
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: "1"
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ccache
          ccache --version | head -n1

      - name: Cache ccache (native build)
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Cache Android CMake & NDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/ndk/27.0.12077973
          key: android-sdk-cmake3.22.1-ndk27.0.12077973

      - name: Install CMake & NDK
        run: |
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "::error::Secret KEYSTORE_BASE64 belum diisi. Build dihentikan agar APK tidak ditandatangani key acak (tidak bisa meng-update versi sebelumnya)."
            exit 1
          fi
          printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASS" "$ALIAS" "$KEY_PASS" > keystore.properties

      - name: Build release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CANVAS_SECRET: ${{ secrets.CANVAS_SECRET }}
          DEBUG_SECRET: ${{ secrets.DEBUG_SECRET }}
        run: |
          set -o pipefail
          chmod +x gradlew
          # Ulangi sampai 3 kali: unduhan dependensi native (libusb) kadang gagal sementara.
          n=0
          until ./gradlew :app:assembleProdRelease --parallel --build-cache --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" 2>&1 | tee build-full.log; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "::error::Build gagal setelah $n percobaan."
              exit 1
            fi
            echo "::warning::Build gagal, mengulang ($n/3) dalam 20 detik..."
            sleep 20
          done

      - name: Extract build errors
        if: always()
        run: |
          : > build-error.txt
          if [ -f build-full.log ]; then
            grep -E "^e: |What went wrong|Execution failed|Caused by|FAILURE:|FAILED|error:" build-full.log \
              | awk '!seen[$0]++' | tail -n 40 >> build-error.txt || true
            if [ ! -s build-error.txt ]; then
              tail -n 40 build-full.log >> build-error.txt
            fi
          else
            echo "Log build tidak tersedia." >> build-error.txt
          fi

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Rename APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="$GITHUB_REF_NAME"
          else
            VER="build-$GITHUB_RUN_NUMBER"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/prod/release/*.apk "dist/Zenith-${VER}.apk"
          ls -lh dist

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: RELEASE_NOTES.md

      - name: Pack 7b1d
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          for f in dist/*.apk; do
            zip -9 -j "${f%.apk}.zip" "$f"
          done
          ls -lh dist

      - name: Sync 4f9c2e
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: dev-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Dev build ${{ github.run_number }}
          body: Dev build (owner only).
          files: dist/*.zip

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TOPIC_ID: ${{ secrets.TG_TOPIC_ID }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -eu
          NL=$'\n'

          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          REPO_URL="${SERVER_URL}/${REPO}"
          RUN_URL="${REPO_URL}/actions/runs/${RUN_ID}"
          NOW=$(TZ='Asia/Makassar' date '+%d %b %Y, %H:%M WITA')
          TITLE="${HEAD_MSG%%$'\n'*}"

          # A merge shows what came in instead of the bare "Merge branch" title.
          case "$TITLE" in
            "Merge branch "*|"Merge pull request "*|"Merge remote-tracking branch "*)
              MERGE_SRC=$(printf '%s' "$TITLE" | sed -n "s/^Merge .*branch '\([^']*\)'.*/\1/p")
              if [ -z "$MERGE_SRC" ]; then
                MERGE_SRC=$(printf '%s' "$TITLE" | sed -n 's/^Merge pull request #[0-9]* from //p')
              fi
              MERGED=$(jq -r '[.commits[]? | select(.message | startswith("Merge ") | not) | "- " + (.message | split("\n")[0])] | .[:5] | join("\n")' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
              TITLE="Merged ${MERGE_SRC:-branch} into ${REF_NAME}"
              if [ -n "$MERGED" ]; then TITLE="${TITLE}${NL}${NL}${MERGED}"; fi
              ;;
          esac

          case "$JOB_STATUS" in
            success)
              LABEL="BUILD SUCCESS"
              NOTE="APK has been built and uploaded to the release."
              ;;
            cancelled)
              LABEL="BUILD CANCELLED"
              NOTE="Build was cancelled, most likely replaced by a newer run."
              ;;
            *)
              LABEL="BUILD FAILED"
              NOTE="Check the workflow log for details."
              ;;
          esac

          RULE='━━━━━━━━━━━━━━━━━'
          MSG="<b>${LABEL}</b>${NL}<a href=\"${REPO_URL}\">$(esc "$REPO")</a>${NL}${RULE}${NL}${NL}${NOTE}"
          if [ -n "$TITLE" ]; then
            MSG="${MSG}${NL}${NL}<blockquote>$(esc "$TITLE")</blockquote>"
          fi
          MSG="${MSG}${NL}${NL}<b>Branch</b> : <code>$(esc "$REF_NAME")</code>"
          MSG="${MSG}${NL}<b>Commit</b> : <code>${SHA:0:7}</code>"
          MSG="${MSG}${NL}<b>Actor</b> : $(esc "$ACTOR")"
          MSG="${MSG}${NL}${NL}${RULE}${NL}<b>Run</b> : #${RUN_NUMBER}${NL}<b>Time</b> : ${NOW}"

          if [ "$JOB_STATUS" = "success" ]; then
            KEYBOARD=$(jq -nc --arg r "$RUN_URL" --arg c "${REPO_URL}/commit/${SHA}" --arg l "${REPO_URL}/releases" \
              '{inline_keyboard: [[{text: "Workflow run", url: $r}, {text: "Commit", url: $c}], [{text: "Releases", url: $l}]]}')
          else
            ERR_COPY=$(grep "^e: " build-error.txt | head -n 3 | sed -E 's#^e: file://[^ ]*/##' | tr '\n' ' ' | sed 's/ *$//' | head -c 256)
            [ -n "$ERR_COPY" ] || ERR_COPY=$(grep -m1 -E "What went wrong|Execution failed|Caused by" build-error.txt | head -c 256)
            [ -n "$ERR_COPY" ] || ERR_COPY="Log tidak tersedia"
            KEYBOARD=$(jq -nc --arg r "$RUN_URL" --arg c "${REPO_URL}/commit/${SHA}" --arg t "$ERR_COPY" \
              '{inline_keyboard: [[{text: "Workflow run", url: $r}, {text: "Commit", url: $c}], [{text: "Salin error", copy_text: {text: $t}}]]}')
          fi

          ARGS=(
            --data-urlencode "chat_id=${TG_CHAT_ID}"
            --data-urlencode "parse_mode=HTML"
            --data-urlencode "disable_web_page_preview=true"
            --data-urlencode "text=${MSG}"
            --data-urlencode "reply_markup=${KEYBOARD}"
          )
          if [ -n "${TG_TOPIC_ID:-}" ]; then
            ARGS+=(--data-urlencode "message_thread_id=${TG_TOPIC_ID}")
          fi
          if [ "$JOB_STATUS" != "success" ] && [ -f build-full.log ]; then
            CAPTION="$MSG"
            if [ "${#CAPTION}" -gt 1000 ]; then
              CAPTION="<b>BUILD FAILED</b> run #${RUN_NUMBER} (${REF_NAME})"
            fi
            DOC_ARGS=(
              --form-string "chat_id=${TG_CHAT_ID}"
              --form-string "parse_mode=HTML"
              --form-string "caption=${CAPTION}"
              --form-string "reply_markup=${KEYBOARD}"
              -F "document=@build-full.log;filename=build-log-${RUN_NUMBER}.txt"
            )
            if [ -n "${TG_TOPIC_ID:-}" ]; then
              DOC_ARGS+=(--form-string "message_thread_id=${TG_TOPIC_ID}")
            fi
            curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" "${DOC_ARGS[@]}"
          else
            curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" "${ARGS[@]}"
          fi


